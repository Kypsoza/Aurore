<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>L'Aube Stellaire</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="stone">
  <div id="app">
    <div id="resource-bar"></div>

    <div id="buy-mode-bar">
      <button data-buy-mode="1">x1</button>
      <button data-buy-mode="10">x10</button>
      <button data-buy-mode="max">Max</button>
    </div>

    <div id="upgrade-list"></div>
    <div id="generator-list"></div>

    <div id="save-bar">
      <button id="export-save">Exporter</button>
      <label for="import-save">Importer
        <input type="file" id="import-save" accept="application/json">
      </label>
    </div>
  </div>

  <div id="offline-modal" class="hidden">
    <div class="offline-box">
      <h3>Bon retour !</h3>
      <p class="offline-text"></p>
      <button id="offline-modal-close">Continuer</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
